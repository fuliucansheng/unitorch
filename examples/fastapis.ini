[core/cli]
enabled_services = [
    "core/fastapi/qwen3",
    "core/fastapi/qwen3_vl",
    "core/fastapi/flux2/text2image",
    "core/fastapi/flux2/editing",
    "core/fastapi/wan/text2video",
    "core/fastapi/wan/image2video",
    "core/fastapi/lucy/video_editing",
  ]
device = cpu
use_auth_token = True

# pipeline
[core/fastapi/pipeline/qwen3]
device = ${core/cli:device}

[core/fastapi/pipeline/qwen3_vl]
device = ${core/cli:device}

[core/fastapi/pipeline/flux2/text2image]
pretrained_name = flux2-dev
use_auth_token = ${core/cli:use_auth_token}
device = ${core/cli:device}
max_sequence_length = 512
enable_cpu_offload = True

[core/fastapi/pipeline/flux2/editing]
pretrained_name = flux2-dev
use_auth_token = ${core/cli:use_auth_token}
device = ${core/cli:device}
max_sequence_length = 512
enable_cpu_offload = True

[core/fastapi/pipeline/wan/text2video]
pretrained_name = wan-v2.2-t2v-14b
scheduler_config_path = https://raw.githubusercontent.com/fuliucansheng/unitorch/refs/heads/master/examples/configs/diffusion/schedulers/flow.json
device = ${core/cli:device}
num_infer_timesteps = 50
boundary_ratio = 0.875
enable_cpu_offload = True

[core/fastapi/pipeline/wan/image2video]
pretrained_name = wan-v2.2-i2v-14b
scheduler_config_path = https://raw.githubusercontent.com/fuliucansheng/unitorch/refs/heads/master/examples/configs/diffusion/schedulers/flow.json
device = ${core/cli:device}
num_infer_timesteps = 50
boundary_ratio = 0.9
enable_cpu_offload = True

[core/fastapi/pipeline/lucy/video_editing]
pretrained_name = lucy-edit-v1.1-dev
device = ${core/cli:device}
num_infer_timesteps = 50
expand_timesteps = True
enable_cpu_offload = True
