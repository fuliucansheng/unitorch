# Exact checkpoint: black-forest-labs/FLUX.2-klein-4B. See wiki/guides/flux2_finetuning.md.
[core/cli]
task_name = core/task/deepspeed/supervised
cache_dir = /data/decu/flux2-finetune/runs/flux2.klein-4b.text2image.e2e
from_ckpt_dir = /data/decu/flux2-finetune/no-initial-checkpoint
# Optional existing Hugging Face snapshot directory; no copied weights required.
pretrained_model_path = None
train_file = /data/decu/flux2-finetune/data/text2image.train.tsv
dev_file = /data/decu/flux2-finetune/data/text2image.dev.tsv
test_file = /data/decu/flux2-finetune/data/text2image.test.tsv
output_folder = ${core/cli:cache_dir}/images
learning_rate = 0.00001

[core/model/diffusers/text2image/flux2]
pretrained_name = flux2-klein-4b
pretrained_model_path = ${core/cli:pretrained_model_path}
use_auth_token = False
torch_dtype = bfloat16
gradient_checkpointing = True
text_encoder_out_layers = (9, 18, 27)
guidance_scale = 1.0
num_train_timesteps = 1000
num_infer_timesteps = 4
height = 256
width = 256
# E2E trains every diffusion-transformer parameter; conditioners stay frozen.
freeze_text_encoder = True
freeze_vae_encoder = True

[core/process/diffusion/flux2]
pretrained_name = flux2-klein-4b
pretrained_model_path = ${core/cli:pretrained_model_path}
use_auth_token = False
max_seq_length = 512
image_size = (256, 256)
random_flip = False

[core/dataset/ast]
names = ['prompt', 'image']

[core/dataset/ast/train]
data_files = ${core/cli:train_file}
preprocess_functions = ['core/process/diffusion/flux2/text2image(prompt, image)']

[core/dataset/ast/dev]
data_files = ${core/cli:dev_file}
preprocess_functions = ['core/process/diffusion/flux2/text2image(prompt, image)']

[core/dataset/ast/test]
names = ['prompt']
data_files = ${core/cli:test_file}
preprocess_functions = ['core/process/diffusion/flux2/text2image/inputs(prompt)']

[core/process/diffusion]
output_folder = ${core/cli:output_folder}

[core/optim/adamw]
learning_rate = ${core/cli:learning_rate}

[core/task/deepspeed/supervised]
model = core/model/diffusers/text2image/flux2
dataset = core/dataset/ast
optim = core/optim/adamw
loss_fn = None
score_fn = core/score/loss
monitor_fns = ['core/score/loss']
from_ckpt_dir = ${core/cli:from_ckpt_dir}
to_ckpt_dir = ${core/cli:cache_dir}
train_batch_size = 1
dev_batch_size = 1
num_workers = 0
pin_memory = False
epochs = 1
grad_acc_step = 1
log_freq = 1
ckpt_freq = 10
use_ema = False
config_path = examples/configs/deepspeed/flux2.zero3.cpu.json
zero_stage = 3
cpu_offload = True
zero_init = True
learning_rate = ${core/cli:learning_rate}
# Keep native model/optimizer shards for exact resume.
merge_zero3_checkpoint = False
exclude_freeze_parameters = True
save_checkpoint = latest

# Use --task_name=core/task/supervised for inference after exporting ZeRO-3 shards.
[core/task/supervised]
model = core/model/diffusers/text2image/flux2
dataset = core/dataset/ast
from_ckpt_dir = ${core/cli:from_ckpt_dir}
num_workers = 0
pin_memory = False
test_batch_size = 1
postprocess_fn = core/postprocess/diffusion/image
writer = core/writer/jsonl
output_header = ['prompt']
output_path = ${core/cli:cache_dir}/predictions.jsonl
postprocess_workers = 1
