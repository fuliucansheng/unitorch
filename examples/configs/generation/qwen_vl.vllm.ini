[core/cli]
task_name = core/task/supervised
device = cpu
from_ckpt_dir = ./cache
cache_dir = ./cache
test_file = ./test.tsv

# model
[core/model/vllm/generation/qwen3_vl]
pretrained_name = qwen3-vl-2b-instruct
# hf_name_or_folder = /path/to/local/model   # override pretrained_name with a local path
max_gen_seq_length = 512
tensor_parallel_size = 1
pipeline_parallel_size = 1
gpu_memory_utilization = 0.90
# max_model_len = 32768                       # context window limit; None = inferred from model config
max_num_seqs = 128
max_num_images = 8
enable_prefix_caching = False
dtype = auto                                  # auto | float16 | bfloat16 | float32
enforce_eager = False                         # disable CUDA graph capture (saves VRAM, slower)
# quantization = awq                          # awq | gptq | fp8 | None

# generation params (passed to core/task/infer)
min_gen_seq_length = 0
num_return_sequences = 1
do_sample = False
temperature = 1.0
top_k = 50
top_p = 1.0
repetition_penalty = 1.0

# dataset
[core/dataset/ast]
names = ['encode', 'image']

[core/dataset/ast/test]
data_files = ${core/cli:test_file}
preprocess_functions = ['core/process/qwen_vl/generation/inputs(encode, image)']

# process
[core/process/qwen_vl]
pretrained_name = qwen3-vl-2b-instruct
max_seq_length = 12800
max_gen_seq_length = 512

[core/writer/csv]
escapechar = \

# task
[core/task/supervised]
model = core/model/vllm/generation/qwen3_vl
dataset = core/dataset/ast
output_header = ['encode']
postprocess_fn = core/postprocess/qwen_vl/detokenize
writer = core/writer/csv

from_ckpt_dir = ${core/cli:from_ckpt_dir}
output_path = ${core/cli:cache_dir}/output.txt
test_batch_size = 8
