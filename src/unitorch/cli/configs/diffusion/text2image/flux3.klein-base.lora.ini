# Exact native base; prompts must already be complete source-only scene captions.
[core/cli]
task_name = core/task/supervised
pretrained_model_path = ./weights/flux-3-image-klein-base
cache_dir = ./runs/flux3-text2image-lora
from_ckpt_dir = ./no-initial-checkpoint
train_file = ./data/train.tsv
dev_file = ./data/val.tsv
test_file = ./data/infer.tsv

[core/model/diffusers/text2image/peft/lora/flux3]
pretrained_name = flux3-image-klein-base
pretrained_model_path = ${core/cli:pretrained_model_path}
torch_dtype = bfloat16
vae_dtype = float32
num_infer_timesteps = 50
guidance_scale = 3.5
flow_shift = 6.93
lora_r = 16
lora_alpha = 32
lora_dropout = 0.0
caption_dropout = 0.1
gradient_checkpointing = True
offload_conditioners = False

[core/model/diffusers/flux3/generate]
height = 1536
width = 1024

[core/process/diffusion/flux3]
pretrained_model_path = ${core/cli:pretrained_model_path}
max_seq_length = 8192
image_size = (1024, 1536)

[core/dataset/ast]
names = ['prompt', 'image']

[core/dataset/ast/train]
data_files = ${core/cli:train_file}
preprocess_functions = ['core/process/diffusion/flux3/text2image(prompt, image)']

[core/dataset/ast/dev]
data_files = ${core/cli:dev_file}
preprocess_functions = ['core/process/diffusion/flux3/text2image(prompt, image)']

[core/dataset/ast/test]
names = ['prompt']
data_files = ${core/cli:test_file}
preprocess_functions = ['core/process/diffusion/flux3/text2image/inputs(prompt)']

[core/process/diffusion]
output_folder = ${core/cli:cache_dir}/images

[core/optim/adamw]
learning_rate = 0.00001

[core/task/supervised]
model = core/model/diffusers/text2image/peft/lora/flux3
dataset = core/dataset/ast
loss_fn = None
score_fn = core/score/loss
monitor_fns = ['core/score/loss']
from_ckpt_dir = ${core/cli:from_ckpt_dir}
to_ckpt_dir = ${core/cli:cache_dir}
train_batch_size = 1
dev_batch_size = 1
test_batch_size = 1
num_workers = 0
postprocess_workers = 1
pin_memory = False
epochs = 1
grad_acc_step = 4
max_grad_norm = 1.0
log_freq = 1
ckpt_freq = 100
use_ema = False
optim = core/optim/adamw
use_amp = False
save_optimizer = True
save_checkpoint = default
postprocess_fn = core/postprocess/diffusion/image
writer = core/writer/jsonl
output_header = ['prompt']
output_path = ${core/cli:cache_dir}/predictions.jsonl
