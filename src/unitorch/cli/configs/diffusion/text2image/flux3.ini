# Native base inference from full scene captions. No target image is read.
[core/cli]
task_name = core/task/supervised
pretrained_model_path = ./weights/flux-3-image-klein-base
cache_dir = ./runs/flux3-text2image-base
from_ckpt_dir = ./no-initial-checkpoint
test_file = ./data/infer.tsv

[core/model/diffusers/text2image/flux3]
pretrained_name = flux3-image-klein-base
pretrained_model_path = ${core/cli:pretrained_model_path}
torch_dtype = bfloat16
vae_dtype = float32
num_infer_timesteps = 50
guidance_scale = 3.5
flow_shift = 6.93

[core/model/diffusers/flux3/generate]
height = 1536
width = 1024

[core/process/diffusion/flux3]
pretrained_model_path = ${core/cli:pretrained_model_path}
max_seq_length = 8192
image_size = (1024, 1536)

[core/dataset/ast]
names = ['prompt']

[core/dataset/ast/test]
data_files = ${core/cli:test_file}
preprocess_functions = ['core/process/diffusion/flux3/text2image/inputs(prompt)']

[core/process/diffusion]
output_folder = ${core/cli:cache_dir}/images

[core/task/supervised]
model = core/model/diffusers/text2image/flux3
dataset = core/dataset/ast
from_ckpt_dir = ${core/cli:from_ckpt_dir}
test_batch_size = 1
num_workers = 0
postprocess_workers = 1
postprocess_fn = core/postprocess/diffusion/image
writer = core/writer/jsonl
output_header = ['prompt']
output_path = ${core/cli:cache_dir}/predictions.jsonl
