[core/cli]
enabled_services = ["core/fastapi/servers/zip_saver"]
autostart_services = ${core/cli:enabled_services}

[core/fastapi/servers/zip_saver]
router = /core/fastapi/servers/zip_saver
zip_folder = ./
zip_file_prefix = zip_images
zip_extension = .zip
max_files_per_zip = 10000000
num_thread = 20
random_name = False
