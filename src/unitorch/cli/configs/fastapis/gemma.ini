[core/cli]
enabled_services = [
    "core/fastapi/gemma",
    "core/fastapi/gemma_vl",
  ]
device = cpu
health_check_timeout = 1800

[core/fastapi/pipeline/gemma]
pretrained_name = gemma-4-12b
device = ${core/cli:device}
enable_cpu_offload = True
max_seq_length = 2048
max_gen_seq_length = 256

[core/fastapi/pipeline/gemma_vl]
pretrained_name = gemma-4-12b
device = ${core/cli:device}
enable_cpu_offload = True
max_seq_length = 2048
max_gen_seq_length = 256
